# Repo Rating - Secret Configuration (EXAMPLE)
# Copy this file to config_secret.toml and fill in your values

# Required: OpenRouter API key
openrouter_api_key = "sk-or-v1-your-key-here"

# Optional: GitHub personal access token (for private repos)
# Generate at: https://github.com/settings/tokens
# Required scope: "repo" for private repository access
github_token = ""

# Optional: Mammouth API key (for mammouth models)
mammouth_api_key = "sk-or-v1-your-key-here"