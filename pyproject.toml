[project]
name = "repo-rating"
version = "0.1.0"
description = "Analyze code repositories to extract developer skills for resume building"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "gitpython>=3.1",
]

[project.scripts]
repo-rating = "repo_rating.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_rating"]
